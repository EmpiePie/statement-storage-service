# Profile for running the app on the host (java -jar) while the
# postgres / keycloak / minio containers are reachable on localhost.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/statements
    username: statements
    password: statements

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/statements/protocol/openid-connect/certs

keycloak:
  auth-server-url: http://localhost:8180
  client-secret: statement-service-secret

storage:
  s3:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
