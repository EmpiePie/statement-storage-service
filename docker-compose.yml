services:

  # ================================
  # PostgreSQL (Keycloak + app data)
  # ================================
  postgres:
    image: postgres:16-alpine
    container_name: statement-postgres
    environment:
      POSTGRES_USER: statements
      POSTGRES_PASSWORD: statements
      POSTGRES_DB: statements
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statements"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ================================
  # Keycloak (Identity Provider)
  # ================================
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: statement-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: statements
      KC_DB_PASSWORD: statements
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ================================
  # MinIO (mock S3 bucket)
  # ================================
  minio:
    image: minio/minio:latest
    container_name: statement-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ================================
  # Statement Service (Spring Boot)
  # ================================
  statement-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: statement-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/statements
      SPRING_DATASOURCE_USERNAME: statements
      SPRING_DATASOURCE_PASSWORD: statements
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/statements/protocol/openid-connect/certs
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: statements
      KEYCLOAK_CLIENT_ID: statement-service
      KEYCLOAK_CLIENT_SECRET: statement-service-secret
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_BUCKET: statements
      STORAGE_S3_ACCESS_KEY: minioadmin
      STORAGE_S3_SECRET_KEY: minioadmin
      STATEMENT_TOKEN_TTL_SECONDS: 300
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
  miniodata:
